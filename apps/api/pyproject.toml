[project]
name = "melody-api"
version = "0.3.0"
description = "Melody API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.2.0",
    "greenlet>=3.0.0",
    "alembic>=1.16.5",
    "capcut-tts-api",
    "vieneu-core",
    "vieneu",
    "pyinstaller>=6.21.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uv.sources]
capcut-tts-api = { path = "../../vendor/capcut-tts-api" }
vieneu-core = { path = "../../packages/vieneu-core" }
vieneu = { path = "../../vendor/vieneu-tts" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
