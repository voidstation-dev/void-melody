name: 'Release VoidMelody'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (vX.Y.Z). Must equal the version in tauri.conf.json, Cargo.toml, and apps/web/package.json.'
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatches resolve an explicit tag ref; tag pushes retain GitHub's event ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release-metadata.mjs --github-output

      - name: Verify checkout matches release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "${release_commit}" != "${checkout_commit}" ]; then
            echo "::error::Checked out ${checkout_commit}, but ${RELEASE_TAG} resolves to ${release_commit}."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up desktop dependencies
        run: pnpm setup:desktop

      - name: Verify target-specific desktop bundle inputs
        run: pnpm verify:desktop-bundle -- --target ${{ matrix.target }}

      - name: Run API tests
        run: pnpm test:api

      - name: Run web tests
        run: pnpm test:web

      - name: Run desktop runtime tests
        run: pnpm test:desktop-runtime

      - name: Require updater signing private key
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required to produce signed updater artifacts and latest.json. Add it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/web
          args: ${{ matrix.args }}
          tagName: ${{ steps.metadata.outputs.tag }}
          releaseName: 'VoidMelody ${{ steps.metadata.outputs.tag }}'
          releaseBody: ${{ steps.metadata.outputs.notes }}
          releaseDraft: true
          prerelease: false
          # Prefer the NSIS (setup.exe) bundle for the Windows updater entry in latest.json
          # when both NSIS and WiX (msi) bundles exist. Verified input of tauri-action v1.
          updaterJsonPreferNsis: true
          # Upload the bundles and executables as workflow artifacts in addition to the release.
          uploadWorkflowArtifacts: true
          # Upload the .sig files generated by the Tauri CLI (default true, made explicit).
          uploadUpdaterSignatures: true

      - name: Verify generated macOS release assets
        if: matrix.target == 'aarch64-apple-darwin'
        run: node scripts/verify-release-assets.mjs --target ${{ matrix.target }}

      - name: Verify generated Windows release assets
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: node scripts/verify-release-assets.mjs --target ${{ matrix.target }} --windows-updater nsis
