name: 'Release VoidMelody'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (vX.Y.Z). Must equal the version in tauri.conf.json, Cargo.toml, and apps/web/package.json.'
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: node scripts/release-metadata.mjs --github-output

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up desktop dependencies
        run: pnpm setup:desktop

      - name: Run API tests
        run: pnpm test:api

      - name: Run web tests
        run: pnpm test:web

      - name: Require updater signing private key
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required to produce signed updater artifacts and latest.json. Add it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/web
          args: ${{ matrix.args }}
          tagName: ${{ steps.rel.outputs.tag }}
          releaseName: 'VoidMelody ${{ steps.rel.outputs.tag }}'
          releaseBody: ${{ steps.metadata.outputs.notes }}
          releaseDraft: true
          prerelease: false
          # Prefer the NSIS (setup.exe) bundle for the Windows updater entry in latest.json
          # when both NSIS and WiX (msi) bundles exist. Verified input of tauri-action v1.
          updaterJsonPreferNsis: true
          # Upload the bundles and executables as workflow artifacts in addition to the release.
          uploadWorkflowArtifacts: true
          # Upload the .sig files generated by the Tauri CLI (default true, made explicit).
          uploadUpdaterSignatures: true

      - name: Verify expected release assets are present (draft)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${{ steps.rel.outputs.tag }}"
          echo "Listing GitHub Release assets for tag ${tag} (draft included):"
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' || true
  publish-release:
    needs: publish-tauri
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish draft release
        if: needs.publish-tauri.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          echo "Un-drafting release ${tag} so the updater endpoint serves the new latest.json."
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft >/dev/null 2>&1; then
            echo "::error::Release ${tag} not found; nothing to publish."
            exit 1
          fi
          gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Verify updater endpoint
        if: needs.publish-tauri.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          latest=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[] | select(.name=="latest.json") | .url')
          if [ -z "${latest}" ]; then
            echo "::error::latest.json is missing from release ${tag}; updater cannot discover the new version."
            exit 1
          fi
          echo "latest.json is present at: ${latest}"